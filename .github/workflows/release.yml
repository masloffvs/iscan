name: Release Binary

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build project
        run: bun run build

      - name: Package Assets
        run: |
          mkdir -p release-pkg
          cp dist/iscan release-pkg/
          cp -r dist/web-build release-pkg/
          cp config.yml release-pkg/
          cp README.md release-pkg/
          tar -czvf iscan-linux-x64.tar.gz -C release-pkg .

      - name: Install image tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y libguestfs-tools

      - name: Build Arch image
        env:
          LIBGUESTFS_BACKEND: direct
        run: |
          curl -fL https://fastly.mirror.pkgbuild.com/images/latest/Arch-Linux-x86_64-cloudimg.qcow2 -o Arch-Linux-x86_64-cloudimg.qcow2
          virt-customize -a Arch-Linux-x86_64-cloudimg.qcow2 \
            --run-command 'pacman-key --init' \
            --run-command 'pacman-key --populate archlinux' \
            --run-command 'pacman -Syu --noconfirm'

      - name: Generate Release Notes
        run: |
          sha256_binary="$(sha256sum release-pkg/iscan | awk '{print $1}')"
          sha512_binary="$(sha512sum release-pkg/iscan | awk '{print $1}')"
          sha256_archive="$(sha256sum iscan-linux-x64.tar.gz | awk '{print $1}')"
          sha512_archive="$(sha512sum iscan-linux-x64.tar.gz | awk '{print $1}')"
          sha256_arch_image="$(sha256sum Arch-Linux-x86_64-cloudimg.qcow2 | awk '{print $1}')"
          sha512_arch_image="$(sha512sum Arch-Linux-x86_64-cloudimg.qcow2 | awk '{print $1}')"

          {
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              echo "Automated build from branch \`main\`."
            else
              echo "Release for tag \`${{ github.ref_name }}\`."
            fi
            echo
            echo "Commit: \`${{ github.sha }}\`"
            echo
            echo "## Checksums"
            echo
            echo "### Binary (\`iscan\`)"
            echo "- SHA-256: \`$sha256_binary\`"
            echo "- SHA-512: \`$sha512_binary\`"
            echo
            echo "### Archive (\`iscan-linux-x64.tar.gz\`)"
            echo "- SHA-256: \`$sha256_archive\`"
            echo "- SHA-512: \`$sha512_archive\`"
            echo
            echo "### Arch Image (\`Arch-Linux-x86_64-cloudimg.qcow2\`)"
            echo "- Source: \`https://fastly.mirror.pkgbuild.com/images/latest/Arch-Linux-x86_64-cloudimg.qcow2\`"
            echo "- SHA-256: \`$sha256_arch_image\`"
            echo "- SHA-512: \`$sha512_arch_image\`"
          } > release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body_path: release-notes.md
          files: |
            iscan-linux-x64.tar.gz
            Arch-Linux-x86_64-cloudimg.qcow2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Latest Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          files: |
            iscan-linux-x64.tar.gz
            Arch-Linux-x86_64-cloudimg.qcow2
          name: Latest Build
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
