services:
  hunter:
    AUTH_METHOD: bearer
    API_KEY: 25db4416879baa4541e93504cc23c65ff084934ce9690f0fe4dde0aec037d2ea
    BEARER_TOKEN: "4aJA9:e4463a02-4462-497f-be04-8aa09ec12a49"
  storage:
    DATABASE_URL: "data/iscan.db"

runtime:
  backgroundWorkers:
    SMOL: true
    METRICS_INTERVAL_MS: 1000
    WATCH_REFRESH_MS: 1000
    LOG_RETENTION:
      MAX_ENTRIES_PER_WORKER: 5000
    RESOURCE_LIMITS:
      MAX_YOUNG_GENERATION_SIZE_MB: 16
      MAX_OLD_GENERATION_SIZE_MB: 128
      CODE_RANGE_SIZE_MB: 64
      STACK_SIZE_MB: 8

manifest:
  dependencies:
    bwrap:
      binary: bwrap
      aliases:
        - bubblewrap
      required: false
      description: Bubblewrap sandbox used to execute commands inside bpkg boxes.
    git:
      binary: git
      required: false
      description: Git CLI used to clone AUR package repositories for review.
    pacman:
      binary: pacman
      required: false
      description: Arch Linux package manager used for system package operations.
    paru:
      binary: paru
      required: false
      description: AUR helper used for Arch Linux package and AUR workflows.
    pacstrap:
      binary: pacstrap
      required: false
      description: Arch bootstrap tool used to build bpkg box root filesystems.
    proxychains:
      binary: proxychains4
      aliases:
        - proxychains
      required: true
      description: Proxy wrapper used before launching qemu.
    qemu-system:
      binary: qemu-system-x86_64
      required: true
      description: QEMU system emulator used to run virtual machines.
    qemu-img:
      binary: qemu-img
      required: true
      description: QEMU disk image utility.
    sudo:
      binary: sudo
      required: false
      description: Privilege escalation helper used for non-root pacman mutations.
  kits:
    qemu:
      architecture: x86_64
      machine: q35
      accelerator: kvm
      memoryMb: 2048
      useProxy: false
      autoBootstrapRouterOnLaunch: false
      systemDependencyId: qemu-system
      imageDependencyId: qemu-img
      proxyDependencyId: proxychains
      defaultArgs: []
