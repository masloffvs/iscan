services:
  hunter:
    AUTH_METHOD: bearer
    API_KEY: 25db4416879baa4541e93504cc23c65ff084934ce9690f0fe4dde0aec037d2ea
    BEARER_TOKEN: "4aJA9:e4463a02-4462-497f-be04-8aa09ec12a49"
  storage:
    DATABASE_URL: "data/iscan.db"
  portScan:
    ALLOW_HOSTS: ["*"]
    DENY_HOSTS: []
    ALLOW_PRIVATE_ADDRESSES: true
    ALLOW_LOOPBACK: true
    DENY_PUBLIC_ADDRESSES: false
  exploitdb:
    LIST_URL: "https://www.exploit-db.com/"
    RAW_URL_TEMPLATE: "https://www.exploit-db.com/raw/{id}"
    DOWNLOAD_URL_TEMPLATE: "https://www.exploit-db.com/download/{id}"
    REFRESH_INTERVAL_MS: 86400000
    REQUEST_TIMEOUT_MS: 15000
    PAGE_SIZE: 15
    RECENT_PAGE_WINDOW: 8
    BACKFILL_PAGE_BUDGET: 64
    RAW_FETCH_CONCURRENCY: 4
    REFRESH_ON_EMPTY: true
    BACKFILL_ON_EMPTY: true
  ua:
    REFRESH_INTERVAL_MS: 86400000
    STALE_AFTER_MS: 86400000
    REFRESH_ON_EMPTY: true
    SOURCES:
      - ID: microlink
        KIND: microlink-json
        URL: "https://microlink.io/user-agents.json"
        ENABLED: true
        CATEGORIES:
          - user
          - crawler
          - ai
        RECORD_KINDS:
          - exact
      - ID: arcjet-well-known-bots
        KIND: arcjet-well-known-bots
        URL: "https://raw.githubusercontent.com/arcjet/well-known-bots/main/well-known-bots.json"
        ENABLED: true
        RECORD_KINDS:
          - exact
          - pattern
      - ID: cloudflare-bot-directory
        KIND: cloudflare-bot-directory
        URL: "https://raw.githubusercontent.com/microlinkhq/cloudflare-bot-directory/master/src/index.json"
        ENABLED: true
        RECORD_KINDS:
          - exact
          - pattern
      - ID: crawler-user-agents
        KIND: crawler-user-agents
        URL: "https://raw.githubusercontent.com/monperrus/crawler-user-agents/master/crawler-user-agents.json"
        ENABLED: true
        RECORD_KINDS:
          - exact
          - pattern

runtime:
  backgroundWorkers:
    SMOL: true
    METRICS_INTERVAL_MS: 1000
    WATCH_REFRESH_MS: 1000
    LOG_RETENTION:
      MAX_ENTRIES_PER_WORKER: 5000
    RESOURCE_LIMITS:
      MAX_YOUNG_GENERATION_SIZE_MB: 16
      MAX_OLD_GENERATION_SIZE_MB: 128
      CODE_RANGE_SIZE_MB: 64
      STACK_SIZE_MB: 8

manifest:
  dependencies:
    bwrap:
      binary: bwrap
      aliases:
        - bubblewrap
      required: false
      description: Bubblewrap sandbox used to execute commands inside bpkg boxes.
    git:
      binary: git
      required: false
      description: Git CLI used to clone AUR package repositories for review.
    pacman:
      binary: pacman
      required: false
      description: Arch Linux package manager used for system package operations.
    paru:
      binary: paru
      required: false
      description: AUR helper used for Arch Linux package and AUR workflows.
    pacstrap:
      binary: pacstrap
      required: false
      description: Arch bootstrap tool used to build bpkg box root filesystems.
    proxychains:
      binary: proxychains4
      aliases:
        - proxychains
      required: true
      description: Proxy wrapper used before launching qemu.
    qemu-system:
      binary: qemu-system-x86_64
      required: true
      description: QEMU system emulator used to run virtual machines.
    qemu-img:
      binary: qemu-img
      required: true
      description: QEMU disk image utility.
    sudo:
      binary: sudo
      required: false
      description: Privilege escalation helper used for non-root pacman mutations.
  kits:
    qemu:
      architecture: x86_64
      machine: q35
      accelerator: kvm
      memoryMb: 2048
      useProxy: false
      autoBootstrapRouterOnLaunch: false
      systemDependencyId: qemu-system
      imageDependencyId: qemu-img
      proxyDependencyId: proxychains
      defaultArgs: []
