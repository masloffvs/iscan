x-iscan-common: &iscan-common
  build:
    context: .
    dockerfile: Dockerfile
  image: iscan-arch:latest
  working_dir: /workspace
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment:
    DISPLAY: ${DISPLAY:-:0}
    XDG_RUNTIME_DIR: /tmp/runtime-iscan
  volumes:
    - .:/workspace
    - iscan-node-modules:/workspace/node_modules
    - iscan-bun-cache:/root/.bun/install/cache
    - /tmp/.X11-unix:/tmp/.X11-unix:rw
  stdin_open: true
  tty: true

services:
  iscan:
    <<: *iscan-common
    command: ["bun", "run", "index.ts"]

volumes:
  iscan-node-modules:
  iscan-bun-cache: