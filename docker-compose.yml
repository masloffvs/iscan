x-iscan-common: &iscan-common
  build:
    context: .
    dockerfile: Dockerfile
  image: iscan-arch:latest
  privileged: true
  working_dir: /workspace
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment:
    DISPLAY: ${DISPLAY:-:0}
    DOCKER_HOST: unix:///var/run/docker.sock
    XDG_RUNTIME_DIR: /tmp/runtime-iscan
  volumes:
    - .:/workspace
    - iscan-node-modules:/workspace/node_modules
    - iscan-bun-cache:/root/.bun/install/cache
    - /var/run/docker.sock:/var/run/docker.sock
    - /tmp/.X11-unix:/tmp/.X11-unix:rw
  stdin_open: true
  tty: true
  restart: unless-stopped

services:
  vmserver:
    <<: *iscan-common
    command: ["./iscan", "--vmserver"]

  webui:
    build:
      context: .
      dockerfile: web/Dockerfile
    image: iscan-arch-web:latest
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "33760:80"
    depends_on:
      - vmserver
      - webui
    restart: unless-stopped

volumes:
  iscan-node-modules:
  iscan-bun-cache:
